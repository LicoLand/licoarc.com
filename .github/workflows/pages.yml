name: deploy-pages
on:
  push:
    branches: ["main"]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Resolve one source snapshot
        id: source
        run: python tools/resolve_source.py --mode public --output "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: LicoLand/LicoArc
          ref: ${{ steps.source.outputs.revision }}
          path: .protocol-source
          persist-credentials: false
      - name: Install locked documentation tools
        run: python -m pip install -r requirements.lock
      - name: Test the publishing contract
        run: python -m unittest discover -s tests -v
      - name: Build and check generated documentation
        run: python tools/docs_build.py --source .protocol-source --revision '${{ steps.source.outputs.revision }}'
      - name: Verify site is reproducible
        run: python tools/check_reproducible.py --source .protocol-source --revision '${{ steps.source.outputs.revision }}'
      - name: Record build commits
        run: |
          git rev-parse HEAD > site/renderer-commit.txt
          git -C .protocol-source rev-parse HEAD > site/protocol-commit.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy generated documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
