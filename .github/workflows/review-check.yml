name: Review check

on:
  push:
    branches: ["feature/nostr-layered-v1-20260926"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: review-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Website source validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Record exact review source
        run: |
          mkdir -p /tmp/licoarc-site-review
          git rev-parse HEAD > /tmp/licoarc-site-review/commit.txt
          git archive --format=tar HEAD > /tmp/licoarc-site-review/source.tar
          sha256sum /tmp/licoarc-site-review/source.tar > /tmp/licoarc-site-review/source.sha256
      - name: Retain review source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: website-source
          path: /tmp/licoarc-site-review/
          retention-days: 7
      - name: Verify site
        run: node tools/verify-site.mjs
      - name: Verify pinned protocol source
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const pin = JSON.parse(readFileSync('docs/protocol-source.json'));
          if (pin.repository !== 'LicoLand/LicoArc' || !/^[0-9a-f]{40}$/.test(pin.revision) || /^0{40}$/.test(pin.revision)) throw Error('invalid immutable source pin');
          const response = await fetch(`https://raw.githubusercontent.com/${pin.repository}/${pin.revision}/artifacts/v1/nostr-interop.bundle.json`, {signal: AbortSignal.timeout(30000)});
          if (!response.ok) throw Error(`source fetch failed: ${response.status}`);
          const bundle = await response.json();
          if (bundle.bindingId !== pin.bindingId || !bundle.sources[pin.path]) throw Error('website pin differs from source bundle');
          console.log('Pinned source exists and binding identity matches');
          JS
      - name: Verify version governance
        run: tools/release/verify-version-governance verify
