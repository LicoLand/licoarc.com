name: Review check
on:
  push:
    branches: ["feature/nostr-layered-v1-20260926"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: review-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: Generated documentation review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Resolve one source snapshot
        id: source
        run: python tools/resolve_source.py --mode preview --output "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: LicoLand/LicoArc
          ref: ${{ steps.source.outputs.revision }}
          path: .protocol-source
          persist-credentials: false
      - name: Install locked documentation tools
        run: python -m pip install -r requirements.lock
      - name: Test the publishing contract
        run: python -m unittest discover -s tests -v
      - name: Build and check generated documentation
        run: python tools/docs_build.py --source .protocol-source --revision '${{ steps.source.outputs.revision }}' --preview
      - name: Verify site is reproducible
        run: python tools/check_reproducible.py --source .protocol-source --revision '${{ steps.source.outputs.revision }}' --preview
      - name: Verify repository version governance
        run: tools/release/verify-version-governance verify
      - name: Record renderer/source provenance
        run: |
          git rev-parse HEAD > site/renderer-commit.txt
          git -C .protocol-source rev-parse HEAD > site/protocol-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-preview
          path: site/
          retention-days: 14
