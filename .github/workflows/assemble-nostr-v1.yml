name: Assemble reviewed Nostr V1 website

on:
  push:
    branches: ["feature/nostr-layered-v1-20260926"]
    paths:
      - ".github/nostr-v1-patch/**"
      - ".github/workflows/assemble-nostr-v1.yml"

permissions:
  contents: read

jobs:
  assemble:
    if: github.repository == 'LicoLand/licoarc.com' && github.ref == 'refs/heads/feature/nostr-layered-v1-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Verify exact source base and apply reviewed patch
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b05b01edc3f9f79f23e6b0c5a46e749f4055284f HEAD
          git diff --quiet b05b01edc3f9f79f23e6b0c5a46e749f4055284f HEAD -- . ':(exclude).github/nostr-v1-patch/**' ':(exclude).github/workflows/assemble-nostr-v1.yml'
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.github/nostr-v1-patch/part-{i:02d}.b64').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 164176
          assert hashlib.sha256(patch).hexdigest() == 'b5243fdc40515ef58b7ad39a0ce24d005a87458bd3917815a80cd0186a247701'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
      - name: Verify site and version governance
        run: |
          set -euo pipefail
          node tools/verify-site.mjs
          tools/release/verify-version-governance verify
          git diff --check
      - name: Verify pinned upstream definition
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const pin = JSON.parse(readFileSync('docs/protocol-source.json'));
          if (pin.repository !== 'LicoLand/LicoArc' || pin.revision !== '996dc9162401d31a9747f0a98accf3536b53d765') throw Error('source pin differs from review');
          const response = await fetch(`https://raw.githubusercontent.com/${pin.repository}/${pin.revision}/artifacts/v1/nostr-interop.bundle.json`, {signal: AbortSignal.timeout(30000)});
          if (!response.ok) throw Error(`source fetch failed: ${response.status}`);
          const bundle = await response.json();
          if (bundle.bindingId !== pin.bindingId || !bundle.sources[pin.path]) throw Error('website pin differs from source bundle');
          console.log('Pinned source exists and binding identity matches');
          JS
      - name: Commit verified website source to feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=feature/nostr-layered-v1-20260926
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: present Nostr interoperability and open LicoArc V1 enhancements'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
