name: Assemble reviewed V1 continuity website

on:
  push:
    branches: ["feature/nostr-layered-v1-20260926"]
    paths:
      - ".github/continuity-review/**"
      - ".github/workflows/assemble-continuity-v1.yml"

permissions:
  contents: read

jobs:
  assemble:
    if: github.repository == 'LicoLand/licoarc.com' && github.ref == 'refs/heads/feature/nostr-layered-v1-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.15.0"
      - name: Validate source base and apply checksum-bound edits
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2786be0f983ea5845151738b2bb899c00b5e2f2b HEAD
          git diff --quiet 2786be0f983ea5845151738b2bb899c00b5e2f2b HEAD -- . ':(exclude).github/continuity-review/**' ':(exclude).github/workflows/assemble-continuity-v1.yml'
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          encoded = ''.join(Path(f'.github/continuity-review/part-{i:02d}.b64').read_text().strip() for i in range(3))
          assert len(encoded) == 24944
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(raw) == 138180
          assert hashlib.sha256(raw).hexdigest() == 'd36e877116dfc3720c8e5844b79dcfb8aaf83d58d31dae671b5dec775427a2d5'
          patch = json.loads(raw)
          assert patch['format'] == 'licoarc.reviewed-line-edits.v1'
          assert patch['baseCommit'] == '2786be0f983ea5845151738b2bb899c00b5e2f2b'
          assert len(patch['files']) == 22
          prepared, seen = [], set()
          for entry in patch['files']:
              name = entry['path']
              rel = PurePosixPath(name)
              assert not rel.is_absolute() and str(rel) == name
              assert not any(p in ('..', '.', '.git') for p in rel.parts)
              assert name not in seen
              assert not name.startswith('.github/') or name in ('.github/workflows/pages.yml', '.github/workflows/review-check.yml')
              seen.add(name)
              path = Path(name)
              assert not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              before = path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None) == entry['before']
              lines = (before or b'').decode('utf-8').splitlines(keepends=True)
              end = 0
              for i, j, added in entry['edits']:
                  assert isinstance(i, int) and isinstance(j, int) and end <= i <= j <= len(lines)
                  assert isinstance(added, list) and all(isinstance(v, str) for v in added)
                  end = j
              for i, j, added in reversed(entry['edits']):
                  lines[i:j] = added
              after = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest() == entry['after'], name
              prepared.append((path, after))
          for path, after in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(after)
          print('Applied 22 exact-source edits')
          PY
      - name: Verify site and pinned protocol source
        run: |
          set -euo pipefail
          node tools/verify-site.mjs | tee /tmp/site-verify.log
          node tools/verify-protocol-source.mjs | tee -a /tmp/site-verify.log
          tools/release/verify-version-governance verify 2>&1 | tee -a /tmp/site-verify.log
          git diff --check
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuity-site-validation
          path: /tmp/site-verify.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Leave workflow edits to the authorized repository writer
        run: git restore --source=HEAD -- .github/workflows/pages.yml .github/workflows/review-check.yml
      - name: Commit verified website to the same feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch=feature/nostr-layered-v1-20260926
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote_sha="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: align V1 website with durable communication and live capabilities'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
